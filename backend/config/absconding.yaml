data:
  # Only the Absconding module uses this file. Other modules keep using common_clean.parquet.
  input_path: data/raw/absconding/hive_data_with_features.csv
  clean_path: data/processed/absconding_clean.parquet
  manifest_path: data/manifests/absconding_split_manifest.parquet
  profile_path: artifacts/reports/absconding/absconding_data_profile.json
  interpolation_limit_hours: 6
  columns:
    timestamp: timestamp
    hive: hive_id
    temperature: internal_temperature_c
    humidity: internal_humidity_pct
    co2: co2_ppm
    weight: hive_weight_kg
    external_temperature: external_temperature_c
    external_humidity: external_humidity_pct
    event: absconding_event_label
    precomputed_72h_target: absconding_label_next_72h

split:
  train_fraction: 0.70
  validation_fraction: 0.15
  boundary_gap_hours: 72

module:
  # The source event label describes an active event interval. The data pipeline converts
  # each 0->1 transition into one onset marker before constructing this future target.
  event_column: absconding_happened_1
  active_event_column: absconding_active_1
  target_column: absconding_within_24h
  prediction_horizon_hours: 24
  event_merge_gap_hours: 24
  minimum_history_hours: 168

features:
  lags_hours: [1, 6, 24, 72, 168]
  change_hours: [1, 6, 24, 72, 168]
  rolling_windows_hours: [6, 24, 72, 168]
  rolling_statistics: [mean, std, min, max]

training:
  random_state: 42
  model_candidates:
    - dummy_prior
    - rule_based_stress
    - gaussian_nb
    - logistic_balanced
    - ridge_classifier
    - decision_tree
    - random_forest
    - extra_trees
    - isolation_forest
  threshold_beta: 2.0
  maximum_validation_alert_fraction: 0.05
  comparison_training_rows: 60000
  final_training_rows: 100000
  anomaly_training_rows: 50000
  permutation_importance_rows: 3000
  timeline_points_per_hive: 336

risk:
  medium_threshold_ratio: 0.60
  arm_change_hours: 24
  arm_escalation_threshold: 0.10

lstm:
  sequence_length: 72
  stride: 3
  epochs: 30
  batch_size: 256
  note: "Run python scripts/run_absconding_lstm.py after the classical pipeline."
