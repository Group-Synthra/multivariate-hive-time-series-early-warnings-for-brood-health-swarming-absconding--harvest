research_model_comparison:
  feature_dataset_path: data/processed/harvest_reviewed_feature_dataset.parquet
  reviewed_events_path: data/interim/harvest_events_reviewed.parquet
  feature_manifest_path: artifacts/reports/harvesting/reviewed/features/feature_manifest.csv
  output_directory: artifacts/reports/harvesting/reviewed/research_models
  model_directory: artifacts/models/harvesting/research_v2
  target_column: harvest_within_next_72h_reviewed
  horizon_hours: 72
  session_gap_hours: 12
  false_alert_gap_hours: 6
  random_state: 42
  maximum_negative_to_positive_ratio: 25
  threshold_grid_points: 201
  minimum_validation_event_recall: 1.0
  feature_sets:
    core:
      include:
      - weight_kg_current
      - weight_delta_6h_kg
      - weight_delta_24h_kg
      - weight_delta_72h_kg
      - weight_std_24h_kg
      - weight_std_72h_kg
      - weight_distance_from_max_72h_kg
      - weight_relative_to_max_72h
      - temperature_c_mean_24h
      - temperature_c_std_24h
      - co2_ppm_mean_24h
      - co2_ppm_std_24h
      - co2_flatline_24h_1
      - hour_sin
      - hour_cos
    weight_only:
      include_prefixes:
      - weight_
    no_humidity:
      include_all: true
      exclude_prefixes:
      - humidity_
    full:
      include_all: true
  models:
    logistic_regression:
      enabled: true
      C: 0.1
      l1_ratio: 0.1
      max_iter: 3000
    random_forest:
      enabled: true
      n_estimators: 300
      max_depth: 6
      min_samples_leaf: 50
      max_features: sqrt
      max_samples: 0.7
    xgboost:
      enabled: true
      n_estimators: 350
      learning_rate: 0.03
      max_depth: 3
      min_child_weight: 10
      subsample: 0.7
      colsample_bytree: 0.7
      reg_alpha: 1.0
      reg_lambda: 5.0
    lightgbm:
      enabled: true
      n_estimators: 350
      learning_rate: 0.03
      num_leaves: 7
      max_depth: 3
      min_child_samples: 100
      subsample: 0.7
      colsample_bytree: 0.7
      reg_alpha: 1.0
      reg_lambda: 5.0
