[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multivari-bee-analytics"
version = "0.1.0"
description = "Shared data and feature pipeline for the MULTIVARI honeybee research modules"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "pyarrow>=16.0",
  "PyYAML>=6.0",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "joblib>=1.4",
  "Flask>=3.0,<4.0",
  "Flask-Cors>=4.0,<6.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
